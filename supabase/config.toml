
[functions.send-rappels]
enabled = true
# Appelée par la tâche cron (pas par un utilisateur connecté) -> pas de JWT.
# La sécurité est assurée par l'en-tête secret x-cron-secret (voir la fonction).
verify_jwt = false
entrypoint = "./functions/send-rappels/index.ts"

[functions.scan-facture]
enabled = true
verify_jwt = true
import_map = "./functions/scan-facture/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/scan-facture/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/scan-facture/*.html" ]
